name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +1.99.1 fmt --check
      - name: Check lints
        run: cargo +1.99.1 clippy --offline --locked --all-targets -- -D warnings
      - name: Run tests
        run: cargo +1.99.1 test --offline --locked
      - name: Build offline
        run: cargo +1.99.1 build --offline --locked
